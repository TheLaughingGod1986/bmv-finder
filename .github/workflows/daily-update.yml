name: Daily Land Registry Update

on:
  schedule:
    # Run daily at 2 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Print debug info
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing files:" && ls -al
        echo "Environment variables:" && printenv
    - name: Write Elasticsearch CA cert
      run: |
        mkdir -p elasticsearch-8.13.0/config/certs
        echo "${{ secrets.ELASTIC_CA_CRT }}" > elasticsearch-8.13.0/config/certs/http_ca.crt

    - name: Set CA cert path env var
      run: echo "ELASTIC_CA_CERT_PATH=elasticsearch-8.13.0/config/certs/http_ca.crt" >> $GITHUB_ENV
    - name: Download and import Land Registry data
      env:
        ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
        ES_NODE: ${{ secrets.ES_NODE }}
        ES_USERNAME: ${{ secrets.ES_USERNAME }}
        ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        ES_API_KEY: ${{ secrets.ES_API_KEY }}
        ES_INDEX: ${{ secrets.ES_INDEX }}
        ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
        ELASTICSEARCH_USERNAME: ${{ secrets.ELASTICSEARCH_USERNAME }}
        ELASTICSEARCH_PASSWORD: ${{ secrets.ELASTICSEARCH_PASSWORD }}
      run: node scripts/import-land-registry-sales.js
      
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ACTIONS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan github.com >> ~/.ssh/known_hosts
    - name: Commit and push updated data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "🤖 Automated daily Land Registry data update" || echo "No changes to commit"
        git push git@github.com:TheLaughingGod1986/bmv-finder.git HEAD:main 
    - name: Debug GH_PAT
      run: |
        if [ -z "$GH_PAT" ]; then
          echo "GH_PAT is not set!"
          exit 1
        else
          echo "GH_PAT is set."
        fi
      env:
        GH_PAT: ${{ secrets.GH_PAT }} 