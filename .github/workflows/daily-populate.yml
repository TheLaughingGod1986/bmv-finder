name: Daily KV Population

on:
  schedule:
    # Run daily at 2 AM UTC (when rate limits reset)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  populate-kv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download latest Land Registry data
        run: |
          curl -L -o pp-complete.csv "http://prod1.publicdata.landregistry.gov.uk.s3-website-eu-west-1.amazonaws.com/pp-complete.csv"
          echo "Downloaded $(wc -l < pp-complete.csv) properties"

      - name: Populate Vercel KV
        env:
          KV_URL: ${{ secrets.KV_URL }}
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
        run: npx ts-node --esm scripts/populate-kv-from-action.ts 