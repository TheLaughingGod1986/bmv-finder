name: Daily Data Population

on:
  schedule:
    # Run daily at 2 AM UTC (when rate limits reset)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  populate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Update Elasticsearch data
        env:
          ELASTICSEARCH_URL: ${{ secrets.ELASTICSEARCH_URL }}
          ELASTICSEARCH_API_KEY: ${{ secrets.ELASTICSEARCH_API_KEY }}
        run: npm run update-es-incremental 