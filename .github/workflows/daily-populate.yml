name: Daily KV Population

on:
  schedule:
    # Run daily at 2 AM UTC (when rate limits reset)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  populate-kv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download latest Land Registry data
        run: |
          curl -L -o pp-complete.csv "http://prod1.publicdata.landregistry.gov.uk.s3-website-eu-west-1.amazonaws.com/pp-complete.csv"
          echo "Downloaded $(wc -l < pp-complete.csv) properties"

      - name: Deploy to Vercel
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./

      - name: Wait for deployment
        run: sleep 30

      - name: Trigger KV population
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          curl -X POST "https://${DEPLOY_URL}/api/populate-kv" \
            -H "Content-Type: application/json" \
            --max-time 3600 # 1 hour timeout 