name: Update HPI Data

on:
  schedule:
    # Run on the 1st of each month at 5 AM UTC
    - cron: '0 5 1 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-hpi:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        clean: true
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Print debug info
      run: |
        echo "Current directory: $(pwd)"
        echo "Listing files:" && ls -al
        echo "Environment variables:" && printenv
    - name: Write Elasticsearch CA cert
      run: |
        mkdir -p elasticsearch-8.13.0/config/certs
        echo "${{ secrets.ELASTIC_CA_CRT }}" > elasticsearch-8.13.0/config/certs/http_ca.crt

    - name: Set CA cert path env var
      run: echo "ELASTIC_CA_CERT_PATH=elasticsearch-8.13.0/config/certs/http_ca.crt" >> $GITHUB_ENV
    - name: Update HPI data
      env:
        ES_CLOUD_ID: ${{ secrets.ES_CLOUD_ID }}
        ES_NODE: ${{ secrets.ES_NODE }}
        ES_USERNAME: ${{ secrets.ES_USERNAME }}
        ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
        ES_API_KEY: ${{ secrets.ES_API_KEY }}
        ES_INDEX: ${{ secrets.ES_INDEX }}
      run: node scripts/update-hpi.js
      
    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.ACTIONS_DEPLOY_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan github.com >> ~/.ssh/known_hosts
    - name: Clean up local automation branch (if needed)
      run: |
        git fetch origin
        git reset --hard origin/main
        git branch -D automation-updates || true
    - name: Commit and push updated data
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git commit -m "🤖 Automated HPI data update - $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git pull --rebase git@github.com:TheLaughingGod1986/bmv-finder.git automation-updates || true
        git push git@github.com:TheLaughingGod1986/bmv-finder.git HEAD:automation-updates
    - name: Create Pull Request
      id: create_pr
      uses: peter-evans/create-pull-request@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: automation-updates
        base: main
        title: "🤖 Automated HPI data update"
        body: "This PR was created automatically by the update-hpi workflow."
    - name: Auto-approve PR
      uses: hmarr/auto-approve-action@v3
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Enable auto-merge for PR
      uses: peter-evans/enable-pull-request-automerge@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        pull-request-number: ${{ steps.create_pr.outputs.pull-request-number }}
        merge-method: SQUASH 