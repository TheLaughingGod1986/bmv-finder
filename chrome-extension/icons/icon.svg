<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary gradient using BMV Finder brand colors -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3A7CA5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2C6E91;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for highlights -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5DA271;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B755D;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gold accent for premium feel -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle with shadow -->
  <circle cx="64" cy="64" r="60" fill="url(#primaryGradient)" stroke="#1E3A8A" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- House icon with better proportions -->
  <path d="M28 82 L64 46 L100 82 L100 102 L28 102 Z" fill="white" opacity="0.95"/>
  
  <!-- House roof accent -->
  <path d="M28 82 L64 46 L100 82" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Door with better styling -->
  <rect x="58" y="87" width="12" height="15" fill="url(#primaryGradient)" rx="2"/>
  <circle cx="64" cy="96" r="1" fill="white" opacity="0.8"/>
  
  <!-- Windows with better styling -->
  <rect x="38" y="72" width="10" height="10" fill="white" opacity="0.9" rx="1"/>
  <rect x="80" y="72" width="10" height="10" fill="white" opacity="0.9" rx="1"/>
  
  <!-- Window panes -->
  <line x1="43" y1="77" x2="43" y2="77" stroke="#3A7CA5" stroke-width="1"/>
  <line x1="85" y1="77" x2="85" y2="77" stroke="#3A7CA5" stroke-width="1"/>
  
  <!-- Capture button with accent gradient -->
  <circle cx="100" cy="28" r="18" fill="url(#accentGradient)" stroke="white" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Plus symbol for capture -->
  <line x1="100" y1="20" x2="100" y2="36" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="92" y1="28" x2="108" y2="28" stroke="white" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Small accent dots for visual interest -->
  <circle cx="20" cy="20" r="3" fill="url(#goldGradient)" opacity="0.8"/>
  <circle cx="108" cy="108" r="2" fill="url(#accentGradient)" opacity="0.6"/>
  
  <!-- BMV text indicator (subtle) -->
  <text x="64" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="white" opacity="0.7">BMV</text>
</svg> 