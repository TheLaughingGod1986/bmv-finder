<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMV Finder</title>
    <style>
        body {
            width: 400px;
            min-height: 300px;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5dc 0%, #e5e5e5 100%);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3A7CA5;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
        }
        
        .user-status {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .user-details {
            display: flex;
            align-items: center;
        }
        
        .user-avatar {
            font-size: 24px;
            margin-right: 10px;
        }
        
        .user-text {
            display: flex;
            flex-direction: column;
        }
        
        .user-name {
            font-size: 16px;
            font-weight: bold;
            color: #333;
        }
        
        .user-membership {
            font-size: 14px;
            color: #666;
        }
        
        .sign-in-button {
            background: linear-gradient(135deg, #3A7CA5 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .sign-in-button:hover {
            opacity: 0.9;
        }
        
        .capture-limits {
            display: flex;
            flex-direction: column;
        }
        
        .limit-info {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }
        
        .limit-value {
            font-weight: bold;
            color: #3A7CA5;
        }
        
        .limit-progress {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #3A7CA5 0%, #2980b9 100%);
            border-radius: 4px;
            transition: width 0.3s ease-in-out;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #2980b9 0%, #3498db 100%);
            border-radius: 4px;
        }
        
        .stats {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-weight: 500;
            color: #333;
        }
        
        .stat-value {
            font-weight: bold;
            color: #3A7CA5;
        }
        
        .properties-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .property-item {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #3A7CA5;
        }
        
        .property-price {
            font-size: 18px;
            font-weight: bold;
            color: #3A7CA5;
            margin-bottom: 5px;
        }
        
        .property-address {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .property-details {
            font-size: 12px;
            color: #666;
        }
        
        .empty-state {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 20px;
        }
        
        .clear-button {
            background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .clear-button:hover {
            opacity: 0.9;
        }
        
        .upgrade-prompt {
            margin-bottom: 15px;
        }
        
        .upgrade-prompt a {
            color: #3A7CA5;
            text-decoration: none;
            font-weight: bold;
        }
        
        .upgrade-prompt a:hover {
            text-decoration: underline;
        }
        
        /* Responsive adjustments */
        @media (max-width: 400px) {
            .user-info {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
            
            .sign-in-button {
                align-self: flex-end;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🏠 BMV Finder</div>
        <div class="subtitle">Property Capture Tool</div>
    </div>
    
    <!-- User Status Section -->
    <div class="user-status" id="user-status">
        <div class="user-info">
            <div class="user-details">
                <div class="user-avatar">👤</div>
                <div class="user-text">
                    <div class="user-name" id="user-name">Not Signed In</div>
                    <div class="user-membership" id="user-membership">Free Plan</div>
                </div>
            </div>
            <button class="sign-in-button" id="sign-in-button">Sign In</button>
        </div>
        <div class="capture-limits">
            <div class="limit-info">
                <span class="limit-label">Capture Limit:</span>
                <span class="limit-value" id="capture-limit">0 / 0</span>
            </div>
            <div class="limit-progress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <span class="stat-label">Properties Captured:</span>
            <span class="stat-value" id="property-count">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Last Capture:</span>
            <span class="stat-value" id="last-capture">Never</span>
        </div>
    </div>
    
    <div class="properties-list" id="properties-list">
        <div class="empty-state">No properties captured yet. Visit a property page and click "Capture Property" to get started!</div>
    </div>
    
    <button class="clear-button" id="clear-all">Clear All Properties</button>
    
    <script src="popup.js"></script>
</body>
</html>
