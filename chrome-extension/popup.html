<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMV Finder</title>
    <style>
        body {
            width: 400px;
            min-height: 300px;
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f5dc 0%, #e5e5e5 100%);
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #3A7CA5;
            margin-bottom: 5px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666;
        }
        
        .stats {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .stat-label {
            font-weight: 500;
            color: #333;
        }
        
        .stat-value {
            font-weight: bold;
            color: #3A7CA5;
        }
        
        .properties-list {
            max-height: 200px;
            overflow-y: auto;
        }
        
        .property-item {
            background: white;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border-left: 4px solid #3A7CA5;
        }
        
        .property-price {
            font-size: 18px;
            font-weight: bold;
            color: #3A7CA5;
            margin-bottom: 5px;
        }
        
        .property-address {
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .property-details {
            font-size: 12px;
            color: #666;
        }
        
        .empty-state {
            text-align: center;
            color: #666;
            font-style: italic;
            padding: 20px;
        }
        
        .clear-button {
            background: linear-gradient(135deg, #E74C3C 0%, #C0392B 100%);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        
        .clear-button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🏠 BMV Finder</div>
        <div class="subtitle">Property Capture Tool</div>
    </div>
    
    <div class="stats">
        <div class="stat-item">
            <span class="stat-label">Properties Captured:</span>
            <span class="stat-value" id="property-count">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">Last Capture:</span>
            <span class="stat-value" id="last-capture">Never</span>
        </div>
    </div>
    
    <div class="properties-list" id="properties-list">
        <div class="empty-state">No properties captured yet. Visit a property page and click "Capture Property" to get started!</div>
    </div>
    
    <button class="clear-button" id="clear-all">Clear All Properties</button>
    
    <script src="popup.js"></script>
</body>
</html>
